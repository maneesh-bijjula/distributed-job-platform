spring:
  main:
    banner-mode: off
  application:
    name: job-platform
  lifecycle:
    timeout-per-shutdown-phase: 40s
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/jobs}
    username: ${DATABASE_USER:jobs}
    password: ${DATABASE_PASSWORD:jobs-local}
    hikari:
      maximum-pool-size: ${jobs.capacity.database-pool-size}
      connection-timeout: 5000
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USER:jobs}
    password: ${RABBITMQ_PASSWORD:jobs-local}
    connection-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: ${jobs.capacity.prefetch}
        concurrency: ${jobs.capacity.worker-concurrency}
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 500ms
          multiplier: 2
          max-interval: 2s
  jackson:
    parser:
      strict-duplicate-detection: true
    deserialization:
      fail-on-trailing-tokens: true
      fail-on-unknown-properties: true
      fail-on-numbers-for-enums: true
      accept-float-as-int: false
  mvc:
    problemdetails:
      enabled: true
server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-http-form-post-size: 128KB
jobs:
  capacity:
    database-pool-size: ${JOB_DB_POOL_SIZE:10}
    worker-concurrency: ${WORKER_CONCURRENCY:2}
    prefetch: ${JOB_WORKER_PREFETCH:10}
  metrics:
    refresh-ms: ${JOB_METRICS_REFRESH_MS:5000}
  auth:
    bootstrap-key: ${JOB_BOOTSTRAP_API_KEY:}
  execution:
    lease-seconds: ${JOB_LEASE_SECONDS:15}
    heartbeat-millis: ${JOB_HEARTBEAT_MILLIS:2000}
    default-timeout-seconds: ${JOB_TIMEOUT_SECONDS:30}
    max-recoveries: ${JOB_MAX_RECOVERIES:3}
    monitor-threads: ${JOB_MONITOR_THREADS:4}
    recovery-delay-ms: ${JOB_RECOVERY_DELAY_MS:1000}
  worker:
    enabled: true
    shutdown-millis: ${JOB_LISTENER_SHUTDOWN_MILLIS:35000}
  dispatcher:
    enabled: true
    delay-ms: ${JOB_DISPATCH_DELAY_MS:1000}
    batch-size: ${JOB_DISPATCH_BATCH_SIZE:20}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
logging:
  structured:
    format:
      console: ecs
    json:
      exclude: error.message,error.stack_trace
