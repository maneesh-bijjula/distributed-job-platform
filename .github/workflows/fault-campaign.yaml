name: Full fault injection campaign
on:
  workflow_dispatch:
    inputs:
      seed:
        description: Deterministic trial-order and workload seed
        default: '20261020'
        required: true
        type: string

permissions:
  contents: read

jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify harness safety and accounting
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Run 100 actual fault injections
        env:
          CAMPAIGN_SEED: ${{ inputs.seed }}
        run: python3 scripts/fault_campaign.py --trials 100 --seed "$CAMPAIGN_SEED" --output reports/fault-campaign/full
      - name: Upload fault evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fault-campaign-evidence
          path: reports/fault-campaign/
          if-no-files-found: ignore
      - name: Clean labeled disposable resources
        if: always()
        run: python3 scripts/clean-load-stack.py
