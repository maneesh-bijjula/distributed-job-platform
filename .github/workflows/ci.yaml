name: Build and test
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Unit and integration tests
        run: ./scripts/test.sh
      - name: Build application image
        run: docker compose -p job-platform build api
      - name: Verify packaged lifecycle workflow
        run: |
          python3 scripts/init-auth.py
          docker compose -p job-platform up -d --wait --wait-timeout 120 api worker
          python3 scripts/smoke.py
          python3 scripts/dead-letter-smoke.py
          python3 scripts/auth-smoke.py
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
      - name: Clean up services
        if: always()
        run: docker compose -p job-platform --profile test down
