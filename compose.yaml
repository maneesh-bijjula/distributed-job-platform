name: job-platform

x-app-environment: &app-environment
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/jobs
  SPRING_DATASOURCE_USERNAME: jobs
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-jobs-local}
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_USERNAME: jobs
  SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-jobs-local}
  JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-15}
  JOB_HEARTBEAT_MILLIS: ${JOB_HEARTBEAT_MILLIS:-2000}
  JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-30}
  JOB_MAX_RECOVERIES: ${JOB_MAX_RECOVERIES:-3}
  JOB_MONITOR_THREADS: ${JOB_MONITOR_THREADS:-4}
  JOB_RECOVERY_DELAY_MS: ${JOB_RECOVERY_DELAY_MS:-1000}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
  JOB_METRICS_REFRESH_MS: ${JOB_METRICS_REFRESH_MS:-5000}
  JOB_DB_POOL_SIZE: ${JOB_DB_POOL_SIZE:-10}
  JOB_WORKER_PREFETCH: ${JOB_WORKER_PREFETCH:-10}
  JOB_DISPATCH_BATCH_SIZE: ${JOB_DISPATCH_BATCH_SIZE:-20}
  JOB_DISPATCH_DELAY_MS: ${JOB_DISPATCH_DELAY_MS:-1000}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jobs
      POSTGRES_USER: jobs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobs-local}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobs -d jobs"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: jobs
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-jobs-local}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: job-platform:local
    build: .
    environment:
      <<: *app-environment
      JOBS_WORKER_ENABLED: "false"
      JOB_BOOTSTRAP_API_KEY: ${JOB_BOOTSTRAP_API_KEY:-}
    ports: ["127.0.0.1:${API_PORT:-8080}:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  worker:
    image: job-platform:local
    build: .
    environment:
      <<: *app-environment
      JOBS_WORKER_ENABLED: "true"
      JOBS_DISPATCHER_ENABLED: "false"
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

  test:
    image: maven:3.9.11-eclipse-temurin-21
    profiles: ["test"]
    working_dir: /workspace
    volumes:
      - .:/workspace
      - maven-cache:/root/.m2
    environment:
      <<: *app-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-test:5432/jobs_test
      SPRING_RABBITMQ_HOST: rabbitmq-test
    command: ["mvn", "-B", "-ntp", "verify", "-Pintegration"]
    depends_on:
      postgres-test: {condition: service_healthy}
      rabbitmq-test: {condition: service_healthy}

  postgres-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: jobs_test
      POSTGRES_USER: jobs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobs-local}
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobs -d jobs_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  rabbitmq-test:
    image: rabbitmq:4.1-management-alpine
    profiles: ["test"]
    environment:
      RABBITMQ_DEFAULT_USER: jobs
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-jobs-local}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: ["observability"]
    user: "0:0" # Local mode-0600 secret files remain private on the host.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    secrets: [job_metrics_token]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]

  grafana:
    image: grafana/grafana:13.2.4
    profiles: ["observability"]
    user: "0:0"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports: ["127.0.0.1:${GRAFANA_PORT:-3001}:3000"]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    secrets: [grafana_admin_password]
    depends_on:
      prometheus: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]

secrets:
  job_metrics_token:
    file: ./.observability/metrics-token
  grafana_admin_password:
    file: ./.observability/grafana-admin-password

volumes:
  postgres-data:
  rabbitmq-data:
  maven-cache:
  prometheus-data:
  grafana-data:
