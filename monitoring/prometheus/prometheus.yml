global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: job-platform
    metrics_path: /actuator/prometheus
    scrape_timeout: 4s
    authorization:
      type: Bearer
      credentials_file: /run/secrets/job_metrics_token
    static_configs:
      - targets: [api:8080]
